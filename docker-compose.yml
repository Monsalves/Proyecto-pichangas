services:
  dt-tactico:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dt_tactico_app
    restart: unless-stopped
    ports:
      - "80:3000"
      - "3000:3000"
    environment:
      - PORT=${PORT:-3000}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-super_secret_futbol_key_2026}
      - DB_PATH=/app/data/tactics.db
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
