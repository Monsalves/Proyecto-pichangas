services:
  dt-tactico:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dt_tactico_app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=${PORT:-3000}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - JWT_SECRET=${JWT_SECRET:-super_secret_futbol_key_2026}
      - DB_PATH=/app/data/tactics.db
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads

  caddy:
    image: caddy:2-alpine
    container_name: dt_tactico_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dt-tactico

volumes:
  caddy_data:
  caddy_config:
